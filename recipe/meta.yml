package:
  name: R&S-Power-Supply
  version: "0.1.3"

source:
  path: ..

build:
  noarch: python
  script: "{{ PYTHON }} -m pip install ."

requirements:
  host:
    - python
    - pip
    - setuptools

  run:
    - python
    - pyvisa
    - pyvisa-py
    - psutil
    - zeroconf
    - pyusb

about:
  summary: VISA power supply controller for R&S NGE100