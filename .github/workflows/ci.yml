name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install-and-list:
    name: Install + NGE100 --list (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install .

      # No real power supply is available in CI, so only make sure that the
      # CLI starts and the VISA backend can list resources without errors.
      - name: Run NGE100 --list
        shell: bash
        run: |
          NGE100 --list 2>&1 | tee list_output.txt
          if grep -E "^ERROR|Traceback" list_output.txt; then
            echo "::error::NGE100 --list reported an error"
            exit 1
          fi
